<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Zhong Xin Dao Training home">
    <span class="brand-mark" aria-hidden="true">心</span>
    <span>
      <strong>Zhong Xin Dao</strong>
      <small>Online Training</small>
    </span>
  </a>

  <nav aria-label="Main navigation">
    <a routerLink="/schedule" routerLinkActive="active">Schedule</a>
    <a routerLink="/training" routerLinkActive="active">Training</a>
    @if (auth.user()) {
      <a routerLink="/dashboard" routerLinkActive="active">My training</a>
      <button class="nav-link" type="button" (click)="signOut()">Sign out</button>
    } @else {
      <a class="button button-small" routerLink="/auth">Student sign in</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div>
    <strong>Zhong Xin Dao I Liq Chuan</strong>
    <p>Train attention. Cultivate balance. Meet change with awareness.</p>
  </div>
  <div class="footer-links">
    <a routerLink="/schedule">Class calendar</a>
    <a routerLink="/training">Classes & workshops</a>
    <a routerLink="/auth">Student account</a>
  </div>
</footer>
